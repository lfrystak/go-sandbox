name: Setup Go
description: Checkout repository and set up Go

inputs:
  go-version:
    description: Go version to use
    required: true

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-go@v4
      with:
        go-version: ${{ inputs.go-version }}
